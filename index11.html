<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Party – Selector Detective</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>The Party, 19:30 – 22:30</h1>
    <p>The cake vanished from the kitchen at 21:30. Pick a case to investigate.</p>
  </header>

  <!-- Case buttons are generated by script.js -->
  <nav id="cases" aria-label="Cases"></nav>

  <div class="controls">
    <button id="clear-btn" type="button">Clear</button>
    <button id="reset-btn" type="button">Reset party</button>
  </div>

  <div id="result" aria-live="polite">Choose a case.</div>

  <!-- The house (floors, rooms, guest cards) is built by script.js -->
  <main id="house"></main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
